services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - price-cache:/data
    environment:
      CORS_ORIGINS: http://localhost:5173
      HOUSEHOLD_CAPACITY_KW: "11.0"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  price-cache:
